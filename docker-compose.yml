# Lingkungan pengembangan lokal backend HRIS Blue Rose Tech.
#
#   docker compose up -d --build     # jalankan semua service
#   docker compose logs -f api       # lihat log API
#   docker compose logs -f worker    # lihat log worker (PDF slip, email)
#   docker compose down              # hentikan (data tetap di volume)
#   docker compose down -v           # hentikan dan hapus semua data
#
# Port di host:
#   API + Swagger  http://localhost:3000/docs
#   Bull Board     http://localhost:3000/admin/queues (admin / dev-only-queue-dashboard)
#   PostgreSQL     localhost:5432  (hris / hris, database hris)
#   PostgreSQL test localhost:5433 (hris / hris, database hris_test, profile test)
#   Redis          localhost:6379
#   MinIO S3       http://localhost:9000, console http://localhost:9001 (minioadmin / minioadmin)
#   Mailpit        SMTP localhost:1025, UI http://localhost:8025
#
# Semua kredensial di file ini HANYA untuk pengembangan lokal.

name: hris-blue-rose

x-minio-credentials: &minio-credentials
  MINIO_ROOT_USER: minioadmin
  MINIO_ROOT_PASSWORD: minioadmin

x-backend-env: &backend-env
  NODE_ENV: development
  LOG_LEVEL: debug
  DATABASE_URL: postgresql://hris:hris@postgres:5432/hris?schema=public
  REDIS_URL: redis://redis:6379
  JWT_ACCESS_SECRET: dev-only-access-secret-ganti-di-produksi-0001
  JWT_REFRESH_SECRET: dev-only-refresh-secret-ganti-di-produksi-0002
  S3_ENDPOINT: http://minio:9000
  # Presigned URL dibuka browser di host, bukan dari dalam jaringan Docker.
  S3_PUBLIC_ENDPOINT: http://localhost:9000
  S3_BUCKET: hris-files
  S3_ACCESS_KEY: minioadmin
  S3_SECRET_KEY: minioadmin
  SMTP_HOST: mailpit
  SMTP_PORT: 1025
  MAIL_FROM: HRIS Blue Rose Tech <no-reply@bluerose.test>
  FRONTEND_URL: http://localhost:5173
  TZ: Asia/Jakarta
  # Event file dari bind mount Windows/macOS tidak sampai ke container;
  # watcher TypeScript memakai polling supaya hot reload tetap jalan.
  TSC_WATCHFILE: DynamicPriorityPolling
  TSC_WATCHDIRECTORY: RecursiveDirectoryUsingDynamicPriorityPolling

# Image backend bersama untuk api dan worker (satu build, tag sama).
x-backend: &backend
  build:
    context: ./backend
    target: dev
  image: hris-blue-rose-backend:dev
  volumes:
    - ./backend:/app
    # node_modules milik image (Linux), bukan milik host.
    - /app/node_modules
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio-init:
      condition: service_completed_successfully
    mailpit:
      condition: service_started

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hris
      POSTGRES_PASSWORD: hris
      POSTGRES_DB: hris
      TZ: Asia/Jakarta
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hris -d hris']
      interval: 5s
      timeout: 5s
      retries: 10

  # Database khusus integration test (npm run test:int). Data di tmpfs:
  # hilang saat container berhenti. Profile "test": tidak ikut
  # `docker compose up -d`, jalankan dengan `docker compose up -d postgres-test`.
  postgres-test:
    image: postgres:16-alpine
    profiles: ['test']
    environment:
      POSTGRES_USER: hris
      POSTGRES_PASSWORD: hris
      POSTGRES_DB: hris_test
      TZ: Asia/Jakarta
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hris -d hris_test']
      interval: 2s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # MinIO resmi berhenti menerbitkan image Docker (minio/minio dan minio/mc
  # sudah tidak ada di Docker Hub). pgsty/minio adalah fork komunitas dengan
  # server dan klien `mc` yang sama.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      <<: *minio-credentials
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  # Sekali jalan: membuat bucket S3_BUCKET lalu selesai.
  minio-init:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      <<: *minio-credentials
      S3_BUCKET: hris-files
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -e
        mc alias set hris http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "hris/$$S3_BUCKET"
        echo "Bucket $$S3_BUCKET siap"
    restart: 'no'

  mailpit:
    image: axllent/mailpit:v1.34
    ports:
      - '1025:1025'
      - '8025:8025'

  api:
    <<: *backend
    environment:
      <<: *backend-env
      PORT: 3000
      # Bull Board http://localhost:3000/admin/queues (basic auth di bawah).
      ENABLE_QUEUE_DASHBOARD: 'true'
      QUEUE_DASHBOARD_USER: admin
      QUEUE_DASHBOARD_PASSWORD: dev-only-queue-dashboard
    ports:
      - '3000:3000'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3000/health']
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 5

  # Proses worker BullMQ (src/worker.ts): membuat PDF slip (queue payslip-pdf)
  # dan mengirim email (queue mail). Image dan env sama dengan api, tanpa
  # port HTTP. Menunggu api sehat karena api yang menjalankan prisma generate
  # di bind mount; hasil build worker di dist-worker/ supaya tidak bentrok
  # dengan watcher api di dist/.
  worker:
    <<: *backend
    command: ['npm', 'run', 'start:worker:dev']
    environment:
      <<: *backend-env
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
